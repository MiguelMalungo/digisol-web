<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pelo Contacto | DIGISOL</title>
    <meta name="description" content="Obrigado por contactar a DIGISOL. Entraremos em contacto brevemente.">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            color: #fff;
        }
        
        .thank-you-section {
            background: linear-gradient(rgba(26, 26, 26, 0.85), rgba(26, 26, 26, 0.85)), url('images/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }
        
        .thank-you-container {
            max-width: 800px;
            text-align: center;
        }
        
        .thank-you-icon {
            font-size: 80px;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        
        .thank-you-title {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .thank-you-message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .back-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--dark-color);
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background-color: #fff;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            .thank-you-title {
                font-size: 2.5rem;
            }
            
            .thank-you-icon {
                font-size: 60px;
            }
        }
        
        @media (max-width: 480px) {
            .thank-you-title {
                font-size: 2rem;
            }
            
            .thank-you-message {
                font-size: 1rem;
            }
            
            .thank-you-icon {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo_dg.png" alt="DIGISOL Logo" class="logo-img">
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="services.html">Serviços</a></li>
                    <li><a href="about.html">Sobre Nós</a></li>
                    <li><a href="portfolio.html">Portfólio</a></li>
                    <li><a href="contact.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-toggle">
                <i class="fas fa-bars" style="color: #000;"></i>
            </div>
        </div>
    </header>

    <!-- Thank You Section -->
    <section class="thank-you-section">
        <div class="thank-you-container">
            <div class="thank-you-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="thank-you-title">Obrigado pelo seu contacto!</h1>
            <p class="thank-you-message">A sua mensagem foi enviada com sucesso. Um membro da nossa equipa entrará em contacto consigo brevemente. Agradecemos o seu interesse nos serviços da DIGISOL.</p>
            <a href="index.html" class="back-button">Voltar para a Página Inicial</a>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
